<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>CAPSULE | DEMAIN</title>
    <link rel="stylesheet"
          href="../css/stylecapsule.css">
</head>
<body>
    <div class="capsule-page">
        <h1 id="capsule-title"></h1>
        <p id="capsule-theme"></p>
        <p id="capsule-date"></p>
        <div class="postcard-container" id="postcard">
            <div class="postcard">
                <div class="postcard-front">
                    <img id="postcard-art" src="" alt="Postcard artwork">
                </div>
                <div class="postcard-back">
                    <div class="back-content">
                        <h2>DEMAIN</h2>
                        <p id="capsule-message"></p>
                    </div>
                </div>
            </div>
        </div>
        <p class="open-text">
            CLICK THE POSTCARD TO OPEN
        </p>
    </div>
    <script src="../javascript/capsule.js"></script>
</body>
</html>
