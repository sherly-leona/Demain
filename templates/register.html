<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTER | DEMAIN</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/styleregister.css') }}">
</head>
<body class="registerpage">
    <div class="background-animation"></div>
    <div class="register-box">
        <h1 class="welcome">
            WELCOME
        </h1>
        <form action="{{ url_for('register') }}" method="POST">
            <div class="input-group">
                <label>USERNAME</label>
                <input
                    type="text"
                    id="username"
                    name="name"
                    required
                >
            </div>
            <div class="input-group">
                <label>EMAIL</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >
            </div>
            <div class="input-group">
                <label>PASSWORD</label>
                <div class="password-box">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                    >
                    <span class="eye" onclick="togglepassword()">
                        👁
                    </span>
                </div>
            </div>
            <button
                class="register-btn"
                type="submit">
                REGISTER
            </button>
        </form>
    </div>
    <div id="popup" class="popup hidden">
        <div class="popup-top">
            <span>DEMAIN.EXE</span>
            <button onclick="closePopup()">
                ✕
            </button>
        </div>
        <div class="popup-content">
            <img
                src="{{ url_for('static', filename='images/envelopealert.png') }}"
                alt="alert"
            >
            <p id="popup-message">
                Message Here
            </p>
            <button onclick="closePopup()">
                OK
            </button>
        </div>
    </div>
    <script src="{{ url_for('static', filename='javascript/register.js') }}"></script>
</body>
</html>
