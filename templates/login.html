<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN | DEMAIN</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/stylelogin.css') }}">
</head>
<body class="loginpage">
    <div class="background-animation"></div>
    <div class="login-box">
        <div class="welcome">
            <h1>WELCOME BACK</h1>
        </div>
        <form action="{{ url_for('login') }}" method="POST">
            <div class="input-group">
                <label>EMAIL</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >
            </div>
            <div class="input-group">
                <label>PASSWORD</label>
                <div class="password-box">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                    >
                    <span
                        class="eye"
                        onclick="togglepassword()">
                        👁
                    </span>
                </div>
            </div>
            <button
                class="login-btn"
                type="submit">
                LOGIN
            </button>
        </form>
    </div>
    <div id="popup" class="popup hidden">
        <div class="popup-top">
            <span>DEMAIN.EXE</span>
            <button type="button" onclick="closePopup()">
                ✕
            </button>
        </div>
        <div class="popup-content">
            <img
                src="{{ url_for('static', filename='images/envelopeart.gif') }}"
                alt="heart"
            >
            <p id="popup-message">
                Message Here
            </p>
            <button type="button" onclick="closePopup()">
                OK
            </button>
        </div>
    </div>
    <script src="{{ url_for('static', filename='javascript/login.js') }}"></script>
</body>
</html>
