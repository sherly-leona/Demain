<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>POSTCARD | DEMAIN</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/stylepostcard.css') }}">
</head>
<body>
    <div class="container">
        <h1 id="theme-name">
            SKY LETTERS
        </h1>
        <div class="art-section">
            <img
                id="artImage"
                src="{{ url_for('static', filename='images/postcard.png') }}"
                class="art-card"
                alt="Selected theme artwork">
        </div>
        <div class="writing-page">
            <img
                src="{{ url_for('static', filename='images/postcard.png') }}"
                class="postcard-bg"
                alt="Postcard">
            <div class="lines-container">
                <textarea
                    id="message"
                    placeholder="Write your memory..."></textarea>
            </div>
        </div>
        <div class="buttons">
            <button
                id="sealBtn"
                type="button"
                onclick="savePostcard()">
                SEAL CAPSULE
            </button>
        </div>
    </div>
    <script src="{{ url_for('static', filename='javascript/postcard.js') }}"></script>
</body>
</html>
